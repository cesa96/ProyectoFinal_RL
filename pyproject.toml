[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-final-rl"
version = "0.1.0"
description = "Validación y análisis exploratorio de datos OHLCV para un proyecto de RL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gym-trading-env==0.3.5",
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
]

[tool.setuptools]
packages = ["src"]
