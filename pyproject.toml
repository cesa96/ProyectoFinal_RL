[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-final-rl"
version = "0.1.0"
description = "Agente de Reinforcement Learning (DQN) para decisiones de inversión en BTC/USDT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gym-trading-env==0.3.5",
    "gymnasium==1.4.0",
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pytest==9.1.1",
    "scikit-learn==1.5.2",
    "stable-baselines3==2.9.0",
    "torch==2.14.1",
]

[tool.setuptools]
packages = ["src"]
